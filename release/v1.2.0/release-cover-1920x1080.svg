<?xml version="1.0" encoding="UTF-8"?>
<!-- ============================================================
  Android Battery Master v1.2.0 · Release Cover (1920x1080)
  设计语言严格对齐 DesignTokens.kt：AMOLED 玻璃拟态 · 赛博 HUD
  ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- 光晕 -->
    <radialGradient id="glowEm"><stop offset="0" stop-color="#10B981" stop-opacity=".22"/><stop offset="1" stop-color="#10B981" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowCyan"><stop offset="0" stop-color="#22D3EE" stop-opacity=".17"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowPur"><stop offset="0" stop-color="#A855F7" stop-opacity=".15"/><stop offset="1" stop-color="#A855F7" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowSky"><stop offset="0" stop-color="#38BDF8" stop-opacity=".10"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowCard"><stop offset="0" stop-color="#10B981" stop-opacity=".16"/><stop offset="1" stop-color="#10B981" stop-opacity="0"/></radialGradient>
    <!-- 网格渐隐遮罩 -->
    <radialGradient id="gridFade" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/><stop offset=".45" stop-color="#ffffff" stop-opacity=".5"/><stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <mask id="fadeMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
      <rect width="1920" height="1080" fill="url(#gridFade)"/>
    </mask>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 .5H.5V64" fill="none" stroke="#1E293B" stroke-opacity=".32" stroke-width="1"/>
    </pattern>
    <!-- 暗角 -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset=".55" stop-color="#02040A" stop-opacity="0"/><stop offset="1" stop-color="#02040A" stop-opacity=".78"/>
    </radialGradient>
    <!-- 玻璃面板 -->
    <linearGradient id="glass" x1="0" y1="0" x2=".28" y2="1">
      <stop offset="0" stop-color="#0F172A" stop-opacity=".82"/><stop offset="1" stop-color="#090D16" stop-opacity=".68"/>
    </linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399" stop-opacity="0"/><stop offset=".4" stop-color="#34D399" stop-opacity=".55"/>
      <stop offset=".7" stop-color="#22D3EE" stop-opacity=".45"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <!-- V1.2.0 渐变字 -->
    <linearGradient id="verGrad" gradientUnits="userSpaceOnUse" x1="104" y1="390" x2="790" y2="560">
      <stop offset="0" stop-color="#34D399"/><stop offset=".34" stop-color="#10B981"/><stop offset=".62" stop-color="#2DD4BF"/><stop offset=".92" stop-color="#22D3EE"/>
    </linearGradient>
    <!-- 电量条渐变 / 顶饰胶囊 -->
    <linearGradient id="barGrad" gradientUnits="userSpaceOnUse" x1="1206" y1="0" x2="1704" y2="0">
      <stop offset="0" stop-color="#047857"/><stop offset=".45" stop-color="#10B981"/><stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="pillGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="sparkStroke" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="576" y2="0">
      <stop offset="0" stop-color="#10B981"/><stop offset=".55" stop-color="#2DD4BF"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="sparkArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".22"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <pattern id="stripes" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(-55)">
      <rect width="10" height="22" fill="#ffffff" fill-opacity=".13"/>
    </pattern>
    <!-- 滤镜 -->
    <filter id="fVer" x="-10%" y="-30%" width="120%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#10B981" flood-opacity=".35"/></filter>
    <filter id="fHero" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#34D399" flood-opacity=".45"/></filter>
    <filter id="fCard" x="-8%" y="-12%" width="116%" height="130%"><feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#020610" flood-opacity=".72"/></filter>
    <filter id="fBar" x="-10%" y="-120%" width="120%" height="340%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#10B981" flood-opacity=".55"/></filter>
    <filter id="fCyan" x="-10%" y="-60%" width="120%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#22D3EE" flood-opacity=".8"/></filter>
    <filter id="fIcon" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#10B981" flood-opacity=".30"/></filter>
    <filter id="fDot" x="-200%" y="-200%" width="500%" height="500%"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#10B981" flood-opacity=".9"/></filter>
    <filter id="fCap" x="-300%" y="-300%" width="700%" height="700%"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#D1FAE5" flood-opacity=".9"/></filter>
    <filter id="fPill" x="-20%" y="-60%" width="140%" height="220%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10B981" flood-opacity=".45"/></filter>
    <clipPath id="barClip"><rect x="1206" y="388" width="498" height="14" rx="7"/></clipPath>
  </defs>

