    <radialGradient id="pgPur"><stop offset="0" stop-color="#A855F7" stop-opacity=".15"/><stop offset="1" stop-color="#A855F7" stop-opacity="0"/></radialGradient>
    <radialGradient id="pgCard"><stop offset="0" stop-color="#10B981" stop-opacity=".16"/><stop offset="1" stop-color="#10B981" stop-opacity="0"/></radialGradient>
    <radialGradient id="pGridFade" cx="50%" cy="42%" r="72%">
