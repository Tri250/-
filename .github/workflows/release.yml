name: Release

# 推 v* tag 触发发布；也可在 Actions 页手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK 与构建脚本
        run: |
          # runner 自带完整 Android SDK，无需 setup-android（其 sdkmanager 会与预装冲突）
          # 预接受许可证，AGP 缺 platform 37 时可自动补装
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          # git 不保证保留执行位
          chmod +x gradlew

      - name: 构建签名说明
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          # keystore.properties 不在库里（.gitignore）。缺失时 build.gradle.kts
          # 会自动退回 debug 签名，保证能出能装的包；要出正式签名请在
          # repo secrets 配置 KEYSTORE_BASE64 / STORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p keysign
            printf '%s' "$KEYSTORE_B64" | base64 -d > keysign/batterydata
            printf 'storeFile=keysign/batterydata\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$STORE_PASS" "$KEY_ALIAS" "$KEY_PASS" > keystore.properties
            # 正式签名三重校验：store 能打开 → 别名存在 → key 密码能取私钥。
            # 任一失败输出具体诊断（不打印密码），退回 debug 签名保证能出包；
            # 修正 secrets 后自动恢复正式签名
            if ! keytool -list -keystore keysign/batterydata -storepass "$STORE_PASS" >/tmp/ktool.log 2>&1; then
              echo "==> [签名诊断] storePassword 无法打开 keystore："
              grep -iE 'password|keystore|integrity' /tmp/ktool.log | head -3 || tail -3 /tmp/ktool.log
              echo "==> 退回 debug 签名。请修正 secrets: STORE_PASSWORD"
              rm -f keystore.properties
            elif ! keytool -list -keystore keysign/batterydata -storepass "$STORE_PASS" -alias "$KEY_ALIAS" >/tmp/ktool2.log 2>&1; then
              echo "==> [签名诊断] 别名 '$KEY_ALIAS' 不存在，实际别名："
              keytool -list -keystore keysign/batterydata -storepass "$STORE_PASS" 2>/dev/null | grep -E '密钥库条目|key.*Entry|aliases' | head -5
              echo "==> 退回 debug 签名。请修正 secrets: KEY_ALIAS"
              rm -f keystore.properties
            else
              echo "==> 正式签名密钥校验通过（store + alias）"
            fi
          else
            echo "==> 无签名密钥 secrets，使用 debug 签名兜底"
          fi

      - name: 编译 Release 包
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: 整理产物
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$VERSION" = "main" ] && VERSION="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/BatteryData-${VERSION}.apk"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: 验证产物签名与完整性
        run: |
          APK=$(ls dist/*.apk 2>/dev/null || true)
          [ -n "$APK" ] && [ -s "$APK" ] || { echo "==> APK 产物缺失"; exit 1; }
          echo "==> 产物：$APK ($(du -h "$APK" | cut -f1))，签名证书："
          keytool -printcert -jarfile "$APK" 2>/dev/null | head -8 || true

      - name: 上传构建产物（workflow artifact，便于排查）
        uses: actions/upload-artifact@v4
        with:
          name: BatteryData-apk
          path: dist/*.apk

      - name: 创建 GitHub Release 并上传 APK（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES_FILE=/tmp/notes.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber
            gh release view "$TAG" --json body -q .body > "$NOTES_FILE" || true
          else
            cat > "$NOTES_FILE" <<'EOF'
          BatteryData ${TAG}

          - 检查更新新增 CDN 镜像源（jsDelivr 读仓库内更新清单），国内直连可用
          - APK 下载改为多源：国内镜像代理在前、GitHub 直链兜底，逐源自动切换
          - 预计可用时间：充电走系统官方预估（CHARGE_TIME_REMAINING 反射接入，全机型可编译）
          - 健康度：OPPO/vivo/一加/iQOO 识别链修复 + 机型库 135 条（2026 在售）
          - 反推满电容量用浮点电量，健康度不再随电量跨档跳动
          - 系统健康异常（过热/老化等）红标前置警示
          - 电池信息卡新增开机时长 / 开机次数

          无正式签名密钥时 APK 为 debug 签名，与已装 debug 签名版本可覆盖安装。
          EOF
            # 让 heredoc 里的变量生效
            sed -i "s/\${TAG}/${TAG}/" "$NOTES_FILE"
            gh release create "$TAG" dist/*.apk --title "$TAG" --notes-file "$NOTES_FILE"
          fi

      # 把更新清单推回 main：App 内的 CDN 源读 jsDelivr 提供的这份 JSON，
      # 国内用户不连 api.github.com 也能完成「检查更新」
      - name: 生成更新清单 update/latest.json（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          APK_NAME="BatteryData-${VERSION}.apk"
          DIRECT="https://github.com/Tri250/-/releases/download/${TAG}/${APK_NAME}"
          mkdir -p update
          python3 - "$TAG" "$VERSION" "$APK_NAME" "$DIRECT" "$NOTES_FILE" <<'PYEOF'
          import json, re, sys
          tag, version, apk_name, direct, notes_path = sys.argv[1:6]
          notes = ""
          try:
              raw = open(notes_path, encoding="utf-8").read()
              lines = []
              for line in raw.replace("\r\n", "\n").split("\n"):
                  t = re.sub(r"^[\s#>*+-]+", "", line).strip()
                  if not t or t.startswith("![") or t.startswith("[![") or t.startswith("<!--"):
                      continue
                  if re.match(r"(?i)^(batterydata v|full changelog)", t):
                      continue
                  if t in ("安装", "签名", "下载", "已知问题", "注意事项"):
                      break
                  lines.append(t[:56].rstrip() + ("…" if len(t) > 56 else ""))
              notes = "\n".join(lines[:8])
          except OSError:
              pass
          payload = {
              "tag_name": tag,
              "version_name": version,
              "notes": notes,
              "asset_name": apk_name,
              "release_page": f"https://github.com/Tri250/-/releases/tag/{tag}",
              # 镜像代理在前（国内可达），GitHub 直链兜底；App 按顺序尝试
              "apk_urls": [
                  f"https://gh-proxy.com/{direct}",
                  f"https://ghfast.top/{direct}",
                  f"https://mirror.ghproxy.com/{direct}",
                  direct,
              ],
          }
          with open("update/latest.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
          print(open("update/latest.json", encoding="utf-8").read())
          PYEOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update/latest.json
          if git diff --cached --quiet; then
            echo "==> 更新清单无变化"
          else
            git commit -m "chore: 更新清单 ${TAG}"
            git push origin HEAD:main
            echo "==> update/latest.json 已推回 main，jsDelivr 缓存约 12h 后刷新（可用 purge.jsdelivr.net 强刷）"
          fi
