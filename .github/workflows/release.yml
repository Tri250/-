name: Release

# 推 v* tag 触发发布；也可在 Actions 页手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK（compileSdk 37）
        uses: android-actions/setup-android@v3

      - name: 构建签名说明
        run: |
          # keystore.properties 不在库里（.gitignore）。缺失时 build.gradle.kts
          # 会自动退回 debug 签名，保证能出能装的包；要出正式签名请在
          # repo secrets 配置 KEYSTORE_BASE64 / STORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keysign/batterydata
            cat > keystore.properties <<EOF
          storeFile=keysign/batterydata
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          else
            echo "==> 无签名密钥 secrets，使用 debug 签名兜底"
          fi

      - name: 编译 Release 包
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: 整理产物
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$VERSION" = "main" ] && VERSION="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/BatteryData-${VERSION}.apk"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: 上传构建产物（workflow artifact，便于排查）
        uses: actions/upload-artifact@v4
        with:
          name: BatteryData-apk
          path: dist/*.apk

      - name: 创建 GitHub Release 并上传 APK（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber
          else
            gh release create "$TAG" dist/*.apk --title "$TAG" \
              --notes "BatteryData ${TAG}

          - 实时状态 1 秒级刷新（电量/电流/功率/电压/温度）
          - 充放电曲线（功率/电流/电压切换）
          - 充电记录（自动起止/健康度测量/详情曲线）
          - 健康度（设计容量三级来源：手动 > 系统节点 > 内置机型库，适配小米/OPPO/vivo/一加/iQOO）
          - 预计可用时间（充电走系统官方预估，放电按亮屏时长估算）
          - 超级岛（HyperOS）/ 流体云（ColorOS 16+）适配，不支持自动回退系统实况
          - 桌面小部件只读数据接口
          - 应用内更新（GitHub + Gitee 双源）

          无签名密钥时 APK 为 debug 签名，覆盖安装请与已装版本签名一致。"
          fi
