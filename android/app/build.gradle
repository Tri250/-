apply plugin: 'com.android.application'

android {
    namespace = "com.pawsync.pro"
    compileSdk rootProject.ext.compileSdkVersion
    
    // 签名配置
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            def keystorePropertiesFile = rootProject.file('keystore.properties')
            if (keystorePropertiesFile.exists()) {
                def keystoreProperties = new Properties()
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            } else {
                def keystoreFile = System.getenv('KEYSTORE_FILE')
                def keystorePassword = System.getenv('KEYSTORE_PASSWORD')
                def keyAlias = System.getenv('KEY_ALIAS')
                def keyPassword = System.getenv('KEY_PASSWORD')
                
                if (keystoreFile && keystorePassword && keyAlias && keyPassword) {
                    storeFile file(keystoreFile)
                    storePassword keystorePassword
                    keyAlias keyAlias
                    keyPassword keyPassword
                } else {
                    throw new GradleException("Release signing config missing.")
                }
            }
        }
    }
    
    defaultConfig {
        applicationId "com.pawsync.pro"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        resConfigs 'zh', 'en'
        vectorDrawables.useSupportLibrary = true
    }
    
    buildFeatures {
        buildConfig = true
        viewBinding = true
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    // AndroidX 核心库
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.fragment:fragment:1.8.8'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.9.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.9.1'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.9.1'
    
    // Material Design
    implementation 'com.google.android.material:material:1.13.0'
    
    // 启动屏幕
    implementation 'androidx.core:core-splashscreen:1.0.1'
    
    // 生物识别
    implementation 'androidx.biometric:biometric:1.1.0'
    
    // 网络请求
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    
    // JSON 解析
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // 图片加载
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    
    // 数据存储
    implementation 'androidx.datastore:datastore-preferences:1.1.7'
    
    // Room 数据库
    implementation 'androidx.room:room-runtime:2.7.2'
    
    // WorkManager (后台任务)
    implementation 'androidx.work:work-runtime:2.10.2'
    
    // 测试
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}